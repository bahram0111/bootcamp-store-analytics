name: Notify Telegram

on:
  push:
    branches:
      - '**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          IFS=',' read -ra ID_LIST <<< "$CHAT_ID"

          for TARGET_ID in "${ID_LIST[@]}"; do
            CLEAN_ID=$(echo "$TARGET_ID" | xargs)

            TEXT=$(jq -n \
              --arg chat_id "$CLEAN_ID" \
              --arg repo "$REPO" \
              --arg branch "$BRANCH" \
              --arg actor "$ACTOR" \
              --arg msg "$COMMIT_MSG" \
              --arg url "$COMMIT_URL" \
              '{
                chat_id: $chat_id,
                parse_mode: "HTML",
                disable_web_page_preview: true,
                text: "🚀 <b>New Push to</b> <code>\($repo)</code>\n🌿 <b>Branch:</b> <code>\($branch)</code>\n👤 <b>By:</b> \($actor)\n💬 <b>Commit:</b> \($msg)\n🔗 <a href=\"\($url)\">View Commit</a>"
              }')

            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$TEXT")

            echo "Response for ID $CLEAN_ID: $RESPONSE"
          done
